<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>FREUDE — Ribbon (v2, notation-driven)</title>
<!-- installable / offline PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1d1f27" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FREUDE" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css?v=39" />
<!-- Verovio: MusicXML -> SVG notation + timemap (note->time map for the cursor) -->
<script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
<!-- html-midi-player: plays the MIDI that Verovio generates from the same score -->
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.77,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0" defer></script>
<!-- fflate: unzip compressed .mxl MusicXML in-browser -->
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js" defer></script>
<!-- @tonejs/midi: mute/unmute MIDI tracks for instant per-part audio (no Verovio reload) -->
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js" defer></script>
</head>
<body>
  <div id="loader">
    <div class="loader-card">
      <div class="loader-title">FREUDE</div>
      <div class="loader-sub" id="loaderlabel">Loading…</div>
      <div id="loaderbar"><div id="loaderfill"></div></div>
    </div>
  </div>
  <header id="bar">
    <div class="parts" id="parts"><!-- part toggles injected here --></div>
    <div class="spacer"></div>
    <button id="install" class="dimbtn" hidden title="Install FREUDE on this device for offline use">⬇&#xFE0E; Install</button>
    <button id="dimsolo" class="dimbtn" title="Fade the soloist staves so the voices stand out">Dim solo</button>
    <button id="dimpiano" class="dimbtn" title="Fade the piano staves so the voices stand out">Dim piano</button>
    <label class="zoom">zoom
      <input id="zoom" type="range" min="20" max="80" value="40" />
    </label>
    <button id="fullscreen" class="collapsebtn" title="Toggle full screen">⛶&#xFE0E;</button>
    <button id="barcollapse" class="collapsebtn" title="Hide the top bar">▲&#xFE0E;</button>
  </header>

  <!-- slim tabs to restore a collapsed bar -->
  <button id="barexpand" class="edgehandle" title="Show the top bar">▼&#xFE0E;</button>
  <button id="transportexpand" class="edgehandle" title="Show the transport bar">▲&#xFE0E;</button>

  <!-- per-part dropdown (solo/mute, volume, instrument), positioned under the clicked part's caret -->
  <div id="lanemenu" class="lanemenu" hidden>
    <div class="lm-title"></div>
    <div class="lm-row"><button class="lm-solo">Solo</button><button class="lm-mute">Mute</button></div>
    <div class="lm-vol">Vol <input type="range" min="0" max="150" step="5" /><span class="v">100%</span></div>
    <select class="lm-inst"></select>
  </div>
  <div id="status"></div>

  <main id="ribbon-wrap">
    <div id="ribbon"><!-- one system (set of bars) injected here -->
      <div id="box"><!-- tall bar highlight --></div>
    </div>
  </main>

  <footer id="transport">
    <div class="tgroup">
      <button id="toStart" class="tbtn" title="Back to start">⏮&#xFE0E;</button>
      <button id="prevSection" class="tbtn" title="Back one bar">⏪&#xFE0E;</button>
      <button id="play" disabled title="Play / Pause">▶&#xFE0E;</button>
      <button id="nextSection" class="tbtn" title="Forward one bar">⏩&#xFE0E;</button>
      <button id="locate" class="tbtn" title="Jump to playhead">⌖</button>
    </div>
    <div class="tgroup">
      <button id="prev" class="tbtn" title="Previous set of bars">◀</button>
      <span id="barpos" class="time">—</span>
      <button id="next" class="tbtn" title="Next set of bars">▶</button>
    </div>
    <midi-player id="midi" sound-font visualizer="#none" style="display:none"></midi-player>
    <span id="time" class="time">0:00</span>
    <select id="sectionjump" class="sectionjump" title="Jump to a section">
      <option value="">Jump to section…</option>
    </select>
    <label class="tempo" title="Slow down or speed up playback (100% = written tempo)">tempo
      <input id="tempo" type="range" min="-100" max="100" value="0" step="5" />
      <span id="tempopct" class="time">100%</span>
    </label>
    <div class="spacer"></div>
    <button id="transportcollapse" class="collapsebtn" title="Hide the transport bar">▼&#xFE0E;</button>
  </footer>

  <!-- PWA: register the offline service worker + wire the Install button -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
        // warm the soundfont cache once (online) so EVERY instrument plays offline
        setTimeout(warmSoundfont, 5000);
        window.addEventListener("online", warmSoundfont);
      });
    }
    // Pre-fetch every instrument's samples for this score (~21MB, 561 files) in the
    // background. The service worker caches each opaque response, so after this completes
    // all 8 instruments work fully offline at normal volume. Runs once; gated by a flag.
    var SF_FLAG = "sf-warmed-freude-v1";
    async function warmSoundfont() {
      try {
        if (!("serviceWorker" in navigator)) return;
        if (localStorage.getItem(SF_FLAG)) return;
        if (!navigator.onLine) return;
        await navigator.serviceWorker.ready;
        var list = await (await fetch("sf-precache.json")).json();
        var i = 0;
        async function pump() {
          while (i < list.length) {
            var u = list[i++];
            try { await fetch(u, { mode: "no-cors" }); } catch (_) {}
          }
        }
        var lanes = [];
        for (var k = 0; k < 8; k++) lanes.push(pump()); // 8 parallel fetchers
        await Promise.all(lanes);
        localStorage.setItem(SF_FLAG, "1");
      } catch (_) {}
    }
    (function () {
      var deferred = null;
      var btn = document.getElementById("install");
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferred = e;
        if (btn) btn.hidden = false;
      });
      if (btn) btn.addEventListener("click", function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function () {
          deferred = null;
          btn.hidden = true;
        });
      });
      window.addEventListener("appinstalled", function () {
        if (btn) btn.hidden = true;
      });
    })();
  </script>
  <!-- collapsible top bar + transport (state remembered across sessions) -->
  <script>
    (function () {
      var KEY = "freude-collapsed";
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify({
            bar: document.body.classList.contains("bar-collapsed"),
            transport: document.body.classList.contains("transport-collapsed"),
          }));
        } catch (e) {}
      }
      try {
        var s = JSON.parse(localStorage.getItem(KEY) || "{}");
        if (s.bar) document.body.classList.add("bar-collapsed");
        if (s.transport) document.body.classList.add("transport-collapsed");
      } catch (e) {}
      function wire(btnId, cls, on) {
        var b = document.getElementById(btnId);
        if (b) b.addEventListener("click", function () {
          document.body.classList[on ? "add" : "remove"](cls);
          save();
        });
      }
      wire("barcollapse", "bar-collapsed", true);
      wire("barexpand", "bar-collapsed", false);
      wire("transportcollapse", "transport-collapsed", true);
      wire("transportexpand", "transport-collapsed", false);
    })();
  </script>

  <!-- full-screen: manual toggle + auto-enter on first tap when launched as an installed app -->
  <script>
    (function () {
      var root = document.documentElement;
      var enterFn = root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen;
      var exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      var btn = document.getElementById("fullscreen");
      if (!enterFn) { if (btn) btn.style.display = "none"; return; } // e.g. iPhone: home-screen app is already chromeless
      function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
      function enter() { try { var p = enterFn.call(root); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
      function exit() { try { exitFn && exitFn.call(document); } catch (e) {} }
      if (btn) btn.addEventListener("click", function () { isFs() ? exit() : enter(); });
      var asApp = matchMedia("(display-mode: standalone)").matches ||
                  matchMedia("(display-mode: fullscreen)").matches ||
                  navigator.standalone === true;
      if (asApp) {
        var once = function () { window.removeEventListener("pointerdown", once); enter(); };
        window.addEventListener("pointerdown", once, { once: true });
      }
    })();
  </script>
  <script src="app.js?v=41" defer></script>
</body>
</html>
